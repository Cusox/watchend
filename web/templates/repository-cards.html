{{define "repository-cards"}}
{{template "repository-card" .}}
{{if .RepositoryHasMore}}
<div class="load-more" hx-get="/repositories/more?offset={{.RepositoryOffset}}&sort={{.Query}}&direction={{.Direction}}&q={{.Search}}" hx-trigger="revealed" hx-target="this" hx-swap="outerHTML"></div>
{{end}}
{{end}}
